<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Sensor Data with localStorage</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
</head>
<body>
  <h1>Data from accelerometer</h1>
  <button onclick="requestMotionPermission()">Get permission and start sensing</button>
  <button onclick="stopDeviceMotion()">Stop</button>
  <button onclick="downloadCSV('acc')">Download ACC CSV</button>
  <button onclick="clearData('acc')">Clear ACC Data</button>
  
  <h2>Acceleration</h2>
  <p>X: <span id="accel-x">0</span></p>
  <p>Y: <span id="accel-y">0</span></p>
  <p>Z: <span id="accel-z">0</span></p>
  
  <h2>CSV data from Accelerometer</h2>
  <textarea id="acc-csv" style="width:300px;height:200px;"></textarea>
  
  <hr>
  
  <h1>Data from Magnetometer</h1>
  <button onclick="requestOrientationPermission()">Get permission and start sensing</button>
  <button onclick="stopDeviceOrientation()">Stop</button>
  <button onclick="downloadCSV('ori')">Download ORI CSV</button>
  <button onclick="clearData('ori')">Clear ORI Data</button>
  
  <p>Absolute: <span id="ori-abs">0</span></p>
  <p>Alpha: <span id="ori-a">0</span></p>
  <p>Beta:  <span id="ori-b">0</span></p>
  <p>Gamma: <span id="ori-g">0</span></p>
  
  <h2>CSV data from Magnetometer</h2>
  <textarea id="ori-csv" style="width:300px;height:200px;"></textarea>

<script>
  // --- ストレージ操作ユーティリティ ---
  function loadData(key) {
    return JSON.parse(localStorage.getItem(key) || '[]');
  }
  function saveData(key, arr) {
    localStorage.setItem(key, JSON.stringify(arr));
  }

  function renderCSV(type) {
    const key = type==="acc" ? "accData" : "oriData";
    const data = loadData(key);
    const lines = data.map(d => {
      if(type==="acc"){
        return `${d.t},acc,${d.x},${d.y},${d.z}`;
      } else {
        return `${d.t},ori,${d.abs},${d.a},${d.b},${d.g}`;
      }
    });
    $('#' + type + '-csv').val(lines.join('\n'));
  }

  function downloadCSV(type) {
    const textarea = document.getElementById(type + '-csv');
    const blob = new Blob([textarea.value], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${type}_data_${new Date().toISOString()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function clearData(type) {
    const key = type==="acc" ? "accData" : "oriData";
    localStorage.removeItem(key);
    renderCSV(type);
  }

  // --- 加速度センサー ---
  function handleAcceleration(ev) {
    $('#accel-x').text(ev.acceleration.x);
    $('#accel-y').text(ev.acceleration.y);
    $('#accel-z').text(ev.acceleration.z);

    const rec = {
      t: Date.now(),
      x: ev.acceleration.x,
      y: ev.acceleration.y,
      z: ev.acceleration.z
    };
    const arr = loadData('accData');
    arr.push(rec);
    saveData('accData', arr);
    renderCSV('acc');
  }

  function requestMotionPermission(){
    if (DeviceMotionEvent &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted')
            window.addEventListener("devicemotion", handleAcceleration);
        })
        .catch(console.error);
    } else {
      window.addEventListener("devicemotion", handleAcceleration);
    }
  }

  function stopDeviceMotion(){
    window.removeEventListener("devicemotion", handleAcceleration);
  }

  // --- 磁気センサー ---
  function handleOrientation(ev){
    $('#ori-abs').text(ev.absolute);
    $('#ori-a').text(ev.alpha);
    $('#ori-b').text(ev.beta);
    $('#ori-g').text(ev.gamma);

    const rec = {
      t: Date.now(),
      abs: ev.absolute,
      a: ev.alpha,
      b: ev.beta,
      g: ev.gamma
    };
    const arr = loadData('oriData');
    arr.push(rec);
    saveData('oriData', arr);
    renderCSV('ori');
  }

  function requestOrientationPermission(){
    if (DeviceOrientationEvent &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted')
            window.addEventListener("deviceorientation", handleOrientation, true);
        })
        .catch(console.error);
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
    }
  }

  function stopDeviceOrientation(){
    window.removeEventListener("deviceorientation", handleOrientation, true);
  }

  // --- 初期表示で既存データをレンダリング ---
  $(window).on('load', () => {
    renderCSV('acc');
    renderCSV('ori');
  });
</script>
</body>
</html>
